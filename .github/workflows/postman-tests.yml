
name: ConnectOS API Tests - Postman CLI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  automated-api-tests:
    name: Run ConnectOS Mock API Tests
    runs-on: windows-latest

    if: github.ref == 'refs/heads/main'

    steps:

      # ==========================================
      # 1. ENABLE GIT LONG PATHS
      # ==========================================
      - name: Enable Git Long Paths
        shell: pwsh
        run: |
          git config --global core.longpaths true

          Write-Host "Git Long Paths Configuration:"
          git config --global --get core.longpaths

      # ==========================================
      # 2. INSTALL POSTMAN CLI
      # ==========================================
      - name: Install Postman CLI
        shell: powershell
        run: |
          powershell.exe -NoProfile -InputFormat None -ExecutionPolicy AllSigned -Command "[System.Net.ServicePointManager]::SecurityProtocol = 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://dl-cli.pstmn.io/install/win64.ps1'))"

      # ==========================================
      # 3. VERIFY POSTMAN CLI
      # ==========================================
      - name: Verify Postman CLI
        shell: pwsh
        run: |
          postman --version

      # ==========================================
      # 4. LOGIN TO POSTMAN CLOUD
      # ==========================================
      - name: Login to Postman CLI
        shell: pwsh
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:POSTMAN_API_KEY)) {
            throw "POSTMAN_API_KEY is not configured."
          }

          postman login --with-api-key $env:POSTMAN_API_KEY

      # ==========================================
      # 5. CREATE REPORTS DIRECTORY
      # ==========================================
      - name: Create reports directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "reports"

      # ==========================================
      # 6. RUN POSTMAN API TESTS
      # ==========================================
      - name: Run ConnectOS Mock API Tests
        id: postman-run
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " CONNECTOS POSTMAN API TEST EXECUTION"
          Write-Host "======================================"

          & postman collection run `
            "54248427-f05d2160-5d00-40c1-9a89-f9ba74e89d35" `
            -e "2f3590e9-0384-420e-8ad3-25cc7321cb94" `
            --reporters cli 2>&1 |
            Tee-Object -FilePath "reports/postman-cli.log"

          $runExitCode = $LASTEXITCODE

          "exit_code=$runExitCode" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Postman CLI Exit Code: $runExitCode"

          exit $runExitCode

      # ==========================================
      # 7. DISPLAY POSTMAN TEST SUMMARY
      # ==========================================
      - name: Postman Test Summary
        if: always()
        shell: pwsh
        env:
          RUN_OUTCOME: ${{ steps.postman-run.outcome }}
          RUN_EXIT_CODE: ${{ steps.postman-run.outputs.exit_code }}
        run: |
          if ($env:RUN_OUTCOME -eq "success") {
            $status = "PASSED"
          }
          else {
            $status = "FAILED"
          }

          $summary = @"
          ## ConnectOS Postman API Test Summary

          | Information | Result |
          |---|---|
          | Collection | ConnectOS Mock API Tests |
          | Branch | $env:GITHUB_REF_NAME |
          | Test Runner | Postman CLI |
          | Execution Status | **$status** |
          | Exit Code | $env:RUN_EXIT_CODE |
          | Execution Log | reports/postman-cli.log |

          ### Detailed Results

          Open the Run ConnectOS Mock API Tests step
          to review API requests, response codes,
          assertions, and passed/failed tests.

          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      # ==========================================
      # 8. UPLOAD RESULTS EVEN IF TESTS FAIL
      # ==========================================
      - name: Upload Postman CLI Execution Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectos-postman-cli-results
          path: reports/postman-cli.log
          if-no-files-found: warn
          retention-days: 14

      # ==========================================
      # 9. FAIL WORKFLOW IF TESTS FAILED
      # ==========================================
      - name: Fail workflow if API tests failed
        if: steps.postman-run.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "ConnectOS API tests failed. Review the execution log."
