$kind: collection
name: "BUG-014: DELETE /users/{userId} - Missing userId Returns HTML Error"
description: |-
  **Description:**

  - When the {userId} is not provided, the API returns an incorrect HTTP status code and HTML error message instead of a structured JSON API error response.
      

  **Endpoint Test Case:**

  - DELETE /users/{userId} - Delete a user by ID - Missing userId
      

  **Steps to Reproduce:**

  1. Execute the request.
      
  2. Observe the response.
      

  **Actual Result:**

  - Returns an `404 Not Found` status code and HTML error format.
      

  ``` html
  <html lang="en">
  <head>
      <meta charset="utf-8">
      <title>Error</title>
  </head>
  <body>
      <pre class=&#x27;preserveHtml&#x27; class=&#x27;preserveHtml&#x27; class=&#x27;preserveHtml&#x27; class=&#x27;preserveHtml&#x27;>Cannot DELETE /users/</pre>
  </body>
  </html>

   ```

  **Expected Result:**

  - API should return a `400 Bad Request` status code and an error message such as "User ID is required."
order: 13263
