$kind: collection
name: "BUG-010: GET & DELETE /users/{userId} - No Error Message for Invalid User ID"
description: |-
  **Description:**

  - When using an invalid userId, the API returns a `404 Not Found` status code but the response body is empty.
      

  **Endpoint Test Case:**

  - GET /users/{userId} - Retrieve a user by ID - Invalid userId
      
  - GET /users/{userId} - Retrieve a user by ID - Non-existent userId
      
  - DELETE /users/{userId} - Delete a user by ID - Invalid userId
      
  - DELETE /users/{userId} - Delete a user by ID - Non-existent userId
      

  **Steps to Reproduce:**

  1. Execute the request.
      
  2. Observe the response body.
      

  **Actual Result:**

  - The response body is empty.
      
  - No error message is provided.
      

  **Expected Result:**

  - The response body should contain a detailed error message such as "No user found with the specified ID."
order: 11000
