$kind: http-request
url: "{{base_url}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"name\": \"Test User\", \r

    \    \"email\": \"\", // Empty string and below the minimum length of 1.\r

    \    \"nickName\": \"Test\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{admin_access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Response status code should be 400\", () => {\r

      \    pm.response.to.have.status(400);\r

      });"
    language: text/javascript
examples: .resources/Create  a user - Email is empty string.resources/examples
order: 2000
