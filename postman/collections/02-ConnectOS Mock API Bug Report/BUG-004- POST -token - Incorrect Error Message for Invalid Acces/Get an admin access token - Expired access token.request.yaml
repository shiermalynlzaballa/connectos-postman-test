$kind: http-request
url: "{{base_url}}/token"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{expired_access_token}}"
scripts:
  - type: afterResponse
    code: |
      pm.test("Response status code should be 401", () => {
          pm.response.to.have.status(401);
      });
    language: text/javascript
examples: .resources/Get an admin access token - Expired access token.resources/examples
order: 10000
