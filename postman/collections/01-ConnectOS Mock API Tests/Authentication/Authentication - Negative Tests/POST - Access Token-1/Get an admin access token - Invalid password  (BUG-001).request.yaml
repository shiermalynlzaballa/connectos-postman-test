$kind: http-request
url: "{{base_url}}/token"
method: POST
headers:
  Content-Type: ""
auth:
  type: basic
  credentials:
    username: "{{admin_username}}"
    password: "{{invalid_password}}"
scripts:
  - type: afterResponse
    code: >-
      const jsonData = pm.response.json();


      pm.test("Response status code should be 401", () => {
          pm.response.to.have.status(401);
      });


      pm.test("Validate error message", () => {
          pm.expect(jsonData.message).to.eql("Invalid username and\\or password");
      });


      pm.test("Response body should not be null or empty", () => {
          pm.expect(jsonData).to.not.be.null;
          pm.expect(jsonData).to.not.be.empty;
      });
    language: text/javascript
examples: .resources/Get an admin access token - Invalid
  password  (BUG-001).resources/examples
order: 6000
